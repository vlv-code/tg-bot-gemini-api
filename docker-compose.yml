services:
  bot:
    build: .
    container_name: gemini-tg-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1024m
    cpus: 1.5
    # портов нет: бот работает через long polling, входящих подключений не принимает

